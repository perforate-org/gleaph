[package]
name = "ic-stable-lara-formal-verus"
version = "0.0.0"
edition = "2021"
publish = false
description = "Workspace-independent Verus mirror of ic-stable-lara::log_head (intake harness)"

# Empty workspace table: this package is not a member of the repository workspace.
[workspace]

[features]
default = []
verus = ["dep:vstd"]

[dependencies]
vstd = { version = "=0.0.0-2026-10-18-0147", optional = true }
verus-spec-stub = { path = "stub" }

[package.metadata.verus]
verify = true
