[package]
name = "gleaph-routing-canister"
version.workspace = true
edition.workspace = true
license.workspace = true

# Inference canister: receives the INT8 pack in chunked update calls and runs the Glev routing
# model on update calls (one forward exceeds the query instruction budget).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Link the Clang Wasm SIMD kernels from the glev kernel workspace.
c-kernel = ["glev-infer/c-kernel", "dep:glev-kernels-c"]

[dependencies]
gleaph-routing-wire = { path = "../gleaph-routing-wire" }
glev-infer = { git = "https://github.com/perforate-org/glev", rev = "1817866a6248fa0a98004e84c5822f0e8d8d1b15" }
# The C kernel archive link directives do not propagate transitively through glev-infer, so the
# canister depends on the kernel crate directly under the c-kernel feature.
glev-kernels-c = { git = "https://github.com/perforate-org/glev", rev = "1817866a6248fa0a98004e84c5822f0e8d8d1b15", optional = true }
ic-stable-structures.workspace = true
candid.workspace = true
ic-cdk.workspace = true
ic-cdk-macros.workspace = true
serde.workspace = true

[dev-dependencies]
pocket-ic = "15.0.0"
serde_json.workspace = true
