[package]
name = "gleaph-gql-params"
edition = "2024"
version = "0.0.1"
authors = ["Inomoto Yota <yota@perforate.org>"]
license = "MIT OR Apache-2.0"
rust-version = "1.88"
description = "Named GQL parameters, the IntoGqlParam conversion trait, and the gql! query builder"

[dependencies]
candid.workspace = true
ethnum = { workspace = true, optional = true }
gleaph-gql-ic-wire.workspace = true
gleaph-gql-value.workspace = true
f256 = { workspace = true, optional = true }
half = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
serde.workspace = true

[features]
default = ["i256", "u256", "f16", "decimal"]
i256 = ["dep:ethnum", "gleaph-gql-value/i256", "gleaph-gql-ic-wire/i256"]
u256 = ["dep:ethnum", "gleaph-gql-value/u256", "gleaph-gql-ic-wire/u256"]
f16 = ["dep:half", "gleaph-gql-value/f16", "gleaph-gql-ic-wire/f16"]
f128 = ["gleaph-gql-value/f128"]
f256 = ["dep:f256", "gleaph-gql-value/f256", "gleaph-gql-ic-wire/f256"]
decimal = [
    "dep:rust_decimal",
    "gleaph-gql-value/decimal",
    "gleaph-gql-ic-wire/decimal",
]

[dev-dependencies]
serde_json.workspace = true
