[package]
name = "gpui-graph"
description = "A composable property graph visualization component for GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
slotmap = "1.1"
bitvec = "1.1"
glam = "0.33"
rapidhash.workspace = true
web-time.workspace = true

# Rayon drives worker OS threads, which do not exist on the wasm target
# family (unknown-unknown, WASI, wasm64); those builds take the engine's
# serial drivers at every graph size instead.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = "1.12"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
gpui = { workspace = true, features = ["test-support"] }
gpui-platform.workspace = true

[[bench]]
name = "paint_bench"
harness = false

[[bench]]
name = "paint_micro_bench"
harness = false

[[bench]]
name = "layout_bench"
harness = false

[[bench]]
name = "hit_bench"
harness = false
