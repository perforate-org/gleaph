[package]
name = "gpui-graph"
description = "A composable property graph visualization component for GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
slotmap = "1.1"
bitvec = "1.1"
glam = "0.33"
web-time.workspace = true

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
gpui = { workspace = true, features = ["test-support"] }
gpui-platform.workspace = true
rapidhash.workspace = true

[[bench]]
name = "paint_bench"
harness = false

[[bench]]
name = "paint_micro_bench"
harness = false

[[bench]]
name = "layout_bench"
harness = false
