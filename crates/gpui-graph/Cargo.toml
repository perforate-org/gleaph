[package]
name = "gpui-graph"
description = "A composable property graph visualization component for GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui = "0.2.2"
slotmap = "1.1"
bitvec = "1.1"
glam = "0.33"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
gpui = { version = "0.2.2", features = ["test-support"] }
rapidhash.workspace = true

[[bench]]
name = "paint_bench"
harness = false

[[bench]]
name = "paint_micro_bench"
harness = false
