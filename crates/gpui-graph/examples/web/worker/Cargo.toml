[package]
name = "gpui-graph-web-example-worker"
description = "Application-owned worker bootstrap for the gpui-graph web example: drives a minimal WorkerBackend (scene merge -> layout step -> frame build) inside DedicatedWorkerGlobalScope"
version = "0.1.0"
edition = "2024"
publish = false

# `cdylib` produces the wasm module imported by the application-owned
# `assets/worker.js`; `rlib` keeps the entry compilable (and the end-to-end
# round-trip test runnable) on native targets.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-graph = { path = "../../.." }
gpui-graph-web-example-common = { path = "../common" }
glam = "0.33"

# Versions pinned to exactly what the root workspace lockfile resolves for
# gpui-graph's own web glue, so a single wasm-bindgen build is shared and
# JsValue types line up across the `web_transport` boundary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
