[package]
name = "text-analyzer-spike"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Candidate A: dictionary-free rule-based stemmer (UAX #29 + suffix FSA).
rule = []
# Candidate B: vibrato 0.5.x + ipadic-mecab (dictionary loaded from bytes).
vibrato = ["dep:vibrato", "dep:ruzstd"]
# Candidate C: sudachi.rs 0.6.11 (via suiko-sudachi crates.io redistribution) + SudachiDict small (dictionary loaded from bytes).
sudachi = ["dep:sudachi"]
# Candidate D: lindera 6.0 + ipadic embedded dictionary (wasm-embedded landing shape only;
# the lindera 6.0 system-dictionary API is path-only — recorded in plan 0330).
lindera = ["dep:lindera", "dep:lindera-ipadic"]

[dependencies]
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
anyhow = "1"

vibrato = { version = "=0.5.2", default-features = false, optional = true }
ruzstd = { version = "0.7", optional = true }
# The official `sudachi` crate is absent from crates.io (verified 2026-09);
# suiko-sudachi 0.6.11 is the byte-identical unofficial crates.io redistribution of
# WorksApplications/sudachi.rs v0.6.11 (Apache-2.0, bundled plugins + resources,
# bytes-based system-dictionary loading). Recorded in plan 0330.
sudachi = { version = "=0.6.11", package = "suiko-sudachi", optional = true }
lindera = { version = "=6.0.0", optional = true, features = ["embed-ipadic"] }
lindera-ipadic = { version = "=6.0.0", optional = true }