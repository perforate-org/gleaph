[package]
name = "gleaph-gql"
edition = "2024"
version = "0.0.1"
authors = ["Inomoto Yota <yota@perforate.org>"]
license = "MIT OR Apache-2.0"
rust-version = "1.88"

include = [
    "/src",
    "/Cargo.toml",
    "/README.md",
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
]

[dependencies]
gleaph-gql-keywords = { path = "../gql-keywords" }
gleaph-gql-macros = { path = "../gql-macros" }
gleaph-gql-value.workspace = true
ethnum = "1"
f256 = { workspace = true, optional = true }
half.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
rapidhash = "4"
rust_decimal = "1"
thiserror = "2"
rkyv = { workspace = true, optional = true }

[features]
default = ["f128", "f256"]
ast-rkyv-no-span = ["dep:rkyv", "gleaph-gql-value/rkyv"]
cypher = []
sql-compat = []
f128 = []
f256 = ["dep:f256"]
# Gleaph-specific GQL dialect (e.g. `SEARCH ... VECTOR INDEX ...` and edge `INLINE`).
# Non-default: standard-GQL consumers do not need to enable it.
gleaph = []
# AST-based query formatter. Does not imply `gleaph`; format-only consumers
# may enable it alone. Gleaph syntax formatting requires both `format` and `gleaph`.
format = []
# Canonical text (JSON / NDJSON) (de)serialization of `Value`: external-tag single-key
# objects, decimal strings for wide numerics, base64 `Bytes`, order-preserving `Record`
# with duplicate-key rejection, and `Extension` rejected (fail-closed).
serde = ["gleaph-gql-value/serde"]

[dev-dependencies]
serde_json.workspace = true
