[package]
name = "gleaph-explorer-web-worker"
description = "Application-owned ADR 0076 worker bootstrap: drives a gpui-graph WorkerBackend inside DedicatedWorkerGlobalScope, plus the wasm paint-frame timing harness"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-graph = { path = "../../../../crates/gpui-graph" }
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

# Versions pinned to exactly what the root workspace lockfile resolves for
# gpui-graph's own web glue (`crates/gpui-graph/Cargo.toml`), so a single
# wasm-bindgen/js-sys/web-sys build is shared and JsValue types line up across
# the `web_transport` boundary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = [
    "MessageEvent",
    "DedicatedWorkerGlobalScope",
    "console",
] }
