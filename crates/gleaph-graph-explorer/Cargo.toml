[package]
name = "gleaph-graph-explorer"
description = "A GPUI graph explorer that loads a Gleaph graph via the Rust SDK and visualizes prepared-query results as overlays"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gleaph-sdk.workspace = true
gpui-graph.workspace = true
gpui.workspace = true
glam = "0.33"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
rapidhash.workspace = true
gleaph-gql-ic-wire.workspace = true
gleaph-router-wire.workspace = true
gpui-platform.workspace = true
candid.workspace = true
ic-agent.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
