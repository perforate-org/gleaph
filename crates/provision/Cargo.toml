[package]
name = "gleaph-provision"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = { workspace = true }
ic-cdk = { workspace = true }
ic-cdk-macros = { workspace = true }
ic-cdk-management-canister = { workspace = true }
ic-stable-memory-backend = { workspace = true }
ic-stable-structures = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.11"
# Plan 0335: 128-bit dictionary catalog digests (xxh3_128, u128 wire representation).
# Disclosed dep addition scoped to this crate, same form as text-canister (plan 0295).
xxhash-rust = { version = "0.8", features = ["xxh3"] }
gleaph-graph-kernel = { workspace = true }

[dev-dependencies]
candid_parser = "0.4.0"
