[dependencies]
candid.workspace = true
gleaph-bulk-load-api.workspace = true
gleaph-cli.workspace = true
gleaph-codegen.workspace = true
gleaph-gql = { workspace = true }
gleaph-gql-planner = { path = "../gql-planner", features = ["plan-wire"] }
gleaph-gql-ic.workspace = true
gleaph-graph-kernel.workspace = true
gleaph-account = { path = "../account" }
gleaph-migration-api.workspace = true
gleaph-prepared-api.workspace = true
gleaph-router = { path = "../router", features = ["pocket-ic-e2e"] }
gleaph-provision = { path = "../provision" }
pocket-ic = "15.0.0"
serde.workspace = true
serde_json = "1"
text-canister = { path = "../text-canister" }

[build-dependencies]
cargo_metadata = "0.23"
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

