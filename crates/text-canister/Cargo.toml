[package]
name = "text-canister"
version.workspace = true
edition.workspace = true
license.workspace = true

# Text Index canister scaffold (ADR 0077 / plan 0294 slice 9). Owns the production analyzer,
# the stable segment/dict/postings/tombstone/stats state, and the v0 Candid surface. Physical
# kernels (codecs, block-max tables, merge cursors, the DAAT top-k driver) come from
# `ic-stable-text-postings`; scoring parts are supplied by this crate at query time.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
canbench = ["dep:canbench-rs"]

[dependencies]
candid.workspace = true
canbench-rs = { workspace = true, optional = true }
ic-cdk.workspace = true
ic-cdk-macros.workspace = true
ic-stable-linear-hash-map.workspace = true
ic-stable-memory-backend.workspace = true
ic-stable-structures.workspace = true
ic-stable-text-postings = { path = "../ic-stable-text-postings" }
ic-stable-vec-deque.workspace = true
serde.workspace = true
# Backfill pull worker (ADR 0059 §Text build kind): canonical export wire types.
gleaph-graph-kernel.workspace = true
# Slice 0295/structures-swap: 128-bit dictionary digests (xxh3_128). Disclosed dep
# addition scoped to this crate per plan 0295.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
# Plan 0334 ANALYZER_ID=2: MeCab-format ipadic Viterbi over byte-image dictionaries.
# The dictionary is NOT embedded: region 16 carries the MORPHDICT1 container (see
# `state`); `ic-morph-dict` backs the container with stable-memory offset accessors.
morph-dict = { path = "../morph-dict" }
ic-morph-dict = { path = "../ic-morph-dict" }
# Plan 0335 compressed finalize: streaming zstd decompression (wasm-safe, getrandom-free
# per the 0330 audit — re-verified by `cargo tree -p text-canister --target
# wasm32-unknown-unknown -e normal -i getrandom`). Decode-only; the catalog artifact is
# produced off-band with the `zstd` CLI (level 19).
ruzstd = "0.7"

[dev-dependencies]
# Host-only zstd compressor for the compressed-finalize round-trip tests (the canister
# itself only decodes; the catalog artifact is produced off-band with the `zstd` CLI).
zstd = "0.13"
