# Dedicated CARGO_TARGET_DIR (../../target/canbench) so the canbench wasm never clobbers
# the pocket-ic-e2e artifacts under ../../target. The bench wasm is built for wasm32
# (with SIMD from the workspace-root `.cargo/config.toml` target rustflags) because
# canbench's instruction measurement is wasm32-only upstream; this is now also the
# production canister target, so measured numbers map directly onto the real search path.
build_cmd: "CARGO_TARGET_DIR=../../target/canbench cargo build --release --target wasm32-unknown-unknown --locked --features canbench"
wasm_path: "../../target/canbench/wasm32-unknown-unknown/release/text_canister.wasm"
