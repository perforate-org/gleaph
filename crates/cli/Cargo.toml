[package]
name = "gleaph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Gleaph command-line interface"

[lib]
name = "gleaph_cli"
path = "src/lib.rs"

[[bin]]
name = "gleaph"
path = "src/main.rs"

[dependencies]
candid.workspace = true
clap.workspace = true
gleaph-account.workspace = true
gleaph-bulk-load-api.workspace = true
gleaph-codegen.workspace = true
gleaph-gql = { workspace = true, features = ["gleaph", "serde"] }
# Numeric vocabulary must match the rest of the cli graph (prepared-runtime enables
# gleaph-gql f128/f256), so the shared wire enum compiles its matching variant arms.
gleaph-gql-ic-wire = { workspace = true, features = ["f256", "nightly-f128"] }
gleaph-gql-params.workspace = true
gleaph-router-wire.workspace = true
gleaph-graph-kernel.workspace = true
gleaph-index-ddl.workspace = true
gleaph-message-sizing.workspace = true
gleaph-migration-api.workspace = true
gleaph-prepared-api.workspace = true
gleaph-prepared-runtime.workspace = true
ic-agent.workspace = true
ic-management-canister-types.workspace = true
flate2.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true

[dev-dependencies]
gleaph-gql-ic.workspace = true
