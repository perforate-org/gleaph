[package]
name = "gleaph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Gleaph command-line interface"

[lib]
name = "gleaph_cli"
path = "src/lib.rs"

[[bin]]
name = "gleaph"
path = "src/main.rs"

[dependencies]
base64.workspace = true
candid.workspace = true
clap.workspace = true
gleaph-account.workspace = true
gleaph-artifact-api.workspace = true
gleaph-bulk-load-api.workspace = true
gleaph-codegen.workspace = true
gleaph-gql = { workspace = true, features = ["gleaph", "serde"] }
# `for_each_immediate_child_expr` — the canonical Expr child traversal — powers the
# prepared-source element-id projection detector below.
gleaph-gql-planner.workspace = true
# Numeric vocabulary must match the rest of the cli graph (prepared-runtime enables
# gleaph-gql f128/f256), so the shared wire enum compiles its matching variant arms.
gleaph-gql-ic-wire = { workspace = true, features = ["f256", "nightly-f128"] }
gleaph-gql-params.workspace = true
gleaph-router-wire.workspace = true
gleaph-graph-kernel.workspace = true
gleaph-ingress-client.workspace = true
gleaph-index-ddl.workspace = true
gleaph-message-sizing.workspace = true
gleaph-migration-api.workspace = true
gleaph-prepared-api.workspace = true
gleaph-prepared-runtime.workspace = true
ic-agent.workspace = true
ic-management-canister-types.workspace = true
# Secp256k1 key generation for `identity new`. Same major as the lockfile entry pulled in by
# ic-agent (whose PEM parser reads these PKCS#8 files back); default features provide
# arithmetic + pkcs8/PEM encoding, rand_core 0.6 is the CryptoRngCore surface that
# `SecretKey::random` consumes.
k256 = { version = "0.13", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
flate2.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true

[dev-dependencies]
gleaph-gql-ic.workspace = true
