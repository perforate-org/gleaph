[package]
name = "gleaph-cdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gleaph canister SDK helpers for inter-canister calls to the Gleaph Router"

[dependencies]
candid.workspace = true
f256.workspace = true
half.workspace = true
gleaph-gql = { path = "../../../crates/gql", default-features = false, features = ["f256"] }
gleaph-gql-ic-wire.workspace = true
ic-cdk.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
nightly-f128 = ["gleaph-gql/f128", "gleaph-gql-ic-wire/nightly-f128"]
