[package]
name = "gleaph-cdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gleaph canister SDK helpers for inter-canister calls to the Gleaph Router"

[dependencies]
candid.workspace = true
ethnum = { workspace = true, features = ["serde"] }
f256.workspace = true
gleaph-gql-ic-wire = { workspace = true, default-features = false }
gleaph-gql-params.workspace = true
gleaph-gql-value.workspace = true
gleaph-prepared-api.workspace = true
half = { workspace = true, features = ["serde"] }
ic-cdk.workspace = true
ic_principal = { version = "0.1", features = ["serde"] }
rust_decimal = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true

[features]
default = ["temporal-jiff"]
temporal-jiff = ["gleaph-gql-ic-wire/jiff"]
temporal-chrono = ["gleaph-gql-ic-wire/chrono"]
nightly-f128 = ["gleaph-gql-value/f128", "gleaph-gql-ic-wire/nightly-f128"]
