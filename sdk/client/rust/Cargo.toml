[package]
name = "gleaph-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gleaph Rust client SDK for application clients calling the Gleaph Router via ic-agent"

[dependencies]
candid.workspace = true
gleaph-gql-ic-wire.workspace = true
gleaph-gql-params = { workspace = true, features = [
    "i256",
    "u256",
    "f16",
    "decimal",
] }
gleaph-gql-value.workspace = true
gleaph-prepared-api.workspace = true
gleaph-router-wire.workspace = true
ic-agent.workspace = true
ic_principal = { version = "0.1", features = ["serde"] }
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = ["i256", "u256", "f16", "decimal", "temporal-jiff"]
i256 = [
    "gleaph-gql-value/i256",
    "gleaph-gql-ic-wire/i256",
    "gleaph-router-wire/i256",
]
u256 = [
    "gleaph-gql-value/u256",
    "gleaph-gql-ic-wire/u256",
    "gleaph-router-wire/u256",
]
f16 = [
    "gleaph-gql-value/f16",
    "gleaph-gql-ic-wire/f16",
    "gleaph-router-wire/f16",
]
decimal = [
    "gleaph-gql-value/decimal",
    "gleaph-gql-ic-wire/decimal",
    "gleaph-router-wire/decimal",
]
temporal-jiff = ["gleaph-gql-ic-wire/jiff"]
temporal-chrono = ["gleaph-gql-ic-wire/chrono"]
nightly-f128 = [
    "gleaph-gql-value/f128",
    "gleaph-gql-ic-wire/nightly-f128",
    "gleaph-router-wire/nightly-f128",
]
f256 = [
    "gleaph-gql-value/f256",
    "gleaph-gql-ic-wire/f256",
    "gleaph-router-wire/f256",
]
