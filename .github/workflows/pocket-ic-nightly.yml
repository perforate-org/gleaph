name: PocketIC nightly

# The full 81-binary PocketIC gate is a CI/dedicated-machine job, not a per-edit loop
# (scripts/dev-fast.sh is the development lane). It runs nightly and on demand.
on:
  # Manual until a self-hosted runner (macOS or Linux) is available. Hosted macOS runners
  # cannot finish the 81-binary PocketIC suite within the job timeout.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pocket-ic:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      # The workspace depends on the private perforate-org/glev repository through Cargo's
      # git source. GITHUB_TOKEN is scoped to this repository, so use the existing release PAT.
      - name: Authenticate the private Cargo git dependency
        env:
          GLEV_RELEASE_TOKEN: ${{ secrets.GLEV_RELEASE_TOKEN }}
        run: |
          test -n "$GLEV_RELEASE_TOKEN"
          git config --global url."https://x-access-token:${GLEV_RELEASE_TOKEN}@github.com/".insteadOf "https://github.com/"

      # rust-toolchain.toml pins nightly; installing stable's wasm target left the nightly
      # toolchain without std for wasm32, so build.rs could not compile the canisters.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # build.rs post-processes every canister wasm with the same tools as a deploy.
      - name: Install canister wasm tooling
        run: |
          cargo install ic-wasm --version 0.11.1 --locked
          cargo install candid-extractor --version 0.1.6 --locked

      - name: Full PocketIC gate
        env:
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARD_COUNT: 6
          CI_TEST_THREADS: 1
          CI_POCKETIC_OUT: target/audit/ci-pocket-ic/shard-${{ matrix.shard }}
        run: scripts/ci-pocket-ic.sh

      # The MeCab/ko-dic fixtures are ~528MB and gitignored, so a hosted runner cannot run
      # this lane. Enable it only on a runner that has the fixtures, by setting the repository
      # variable POCKET_IC_DICTIONARY_FIXTURES=true.
      - name: Dictionary analyzer lane
        if: ${{ always() && matrix.shard == 0 && vars.POCKET_IC_DICTIONARY_FIXTURES == 'true' }}
        run: TEXT_DICT_TEST_THREADS=4 scripts/text-dictionary-e2e.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ic-logs-${{ matrix.shard }}
          path: target/audit/ci-pocket-ic/shard-${{ matrix.shard }}/
          if-no-files-found: warn
