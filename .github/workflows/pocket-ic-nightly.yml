name: PocketIC nightly

# The full 81-binary PocketIC gate is a CI/dedicated-machine job, not a per-edit loop
# (scripts/dev-fast.sh is the development lane). It runs nightly and on demand.
on:
  schedule:
    # 18:00 UTC = 03:00 Asia/Tokyo.
    - cron: "0 18 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pocket-ic:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The workspace depends on the private perforate-org/glev repository through Cargo's
      # git source. GITHUB_TOKEN is scoped to this repository, so use the existing release PAT.
      - name: Authenticate the private Cargo git dependency
        env:
          GLEV_RELEASE_TOKEN: ${{ secrets.GLEV_RELEASE_TOKEN }}
        run: |
          test -n "$GLEV_RELEASE_TOKEN"
          git config --global url."https://x-access-token:${GLEV_RELEASE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Full PocketIC gate
        run: scripts/ci-pocket-ic.sh

      # The MeCab/ko-dic fixtures are ~528MB and gitignored, so a hosted runner cannot run
      # this lane. Enable it only on a runner that has the fixtures, by setting the repository
      # variable POCKET_IC_DICTIONARY_FIXTURES=true.
      - name: Dictionary analyzer lane
        if: ${{ always() && vars.POCKET_IC_DICTIONARY_FIXTURES == 'true' }}
        run: TEXT_DICT_TEST_THREADS=4 scripts/text-dictionary-e2e.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ic-logs
          path: target/audit/ci-pocket-ic/
          if-no-files-found: warn
