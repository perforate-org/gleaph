name: lean-verify

on:
  push:
    branches: [main]
    paths:
      - "crates/ic-stable-linear-hash-map/**"
      - "crates/ic-stable-vec-deque/**"
  pull_request:
    paths:
      - "crates/ic-stable-linear-hash-map/**"
      - "crates/ic-stable-vec-deque/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - crate: ic-stable-linear-hash-map
            module: Lhm
          - crate: ic-stable-vec-deque
            module: Svd
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain and lake artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            crates/${{ matrix.project.crate }}/formal/.lake
          key: lean-${{ runner.os }}-${{ matrix.project.crate }}-${{ hashFiles('crates/ic-stable-linear-hash-map/formal/lean-toolchain', 'crates/ic-stable-vec-deque/formal/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Rebuild and replay all proofs
        working-directory: crates/${{ matrix.project.crate }}/formal
        run: lake build
      - name: Axiom discipline gate (fail on sorryAx / Classical.choice)
        working-directory: crates/${{ matrix.project.crate }}/formal
        run: |
          lake env lean ${{ matrix.project.module }}.lean 2>&1 | tee axioms.log
          if grep -E "sorryAx|Classical.choice" axioms.log; then
            echo "::error::Axiom discipline violated: sorryAx or Classical.choice found"
            exit 1
          fi
