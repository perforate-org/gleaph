name: Routing artifacts

on:
  pull_request:
    paths:
      - 'crates/gleaph-routing-canister/**'
      - 'crates/gleaph-routing-wire/**'
      - 'sdk/client/rust/src/routing/**'
      - 'demo/knowledge/scripts/routing-bench/fetch_glev_artifacts.py'
      - '.github/workflows/routing-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      # A read-only token for the private perforate-org/glev repository. The job fails closed when
      # it is absent: the pinned artifacts are part of the routing contract.
      GH_TOKEN: ${{ secrets.GLEV_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Configure git credentials for the private glev dependency
        run: |
          test -n "$GH_TOKEN" || { echo "GLEV_RELEASE_TOKEN is required"; exit 1; }
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Fetch and verify the pinned Glev artifacts
        run: |
          eval "$(python3 demo/knowledge/scripts/routing-bench/fetch_glev_artifacts.py --out target/glev-artifacts)"
          test -s "$GLEV_PACK"
          test -s "$GLEV_TOKENIZER"

      - name: Verify the manifest against the canister revision and wire version
        run: cargo test -p gleaph-routing-canister --test artifacts_manifest

      - name: Build the canister wasm with the Glev kernels
        run: cargo build -p gleaph-routing-canister --target wasm32-unknown-unknown --release --features c-kernel
