name: Rust

# No Rust gate existed, which is how a stale `ProvisionGraphArgs` literal could stop the whole
# `gleaph-pocket-ic-tests` target set from compiling without anyone noticing (plans 0331/0343 added two
# fields and one struct literal did not follow). `--tests` is the point: `cargo check` alone skips test
# targets, and the breakage lived in one.
#
# The runner is macOS because the workspace includes macOS-only GUI crates; a Linux runner would fail on
# them for reasons unrelated to the change under review. Costs are bounded by the cache below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # This workflow type-checks and lints; it never runs a PocketIC test. Without this the
  # gleaph-pocket-ic-tests build script would build every canister wasm in release mode first.
  POCKET_IC_SKIP_FEDERATION_WASM: "1"

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace depends on the private perforate-org/glev repository through Cargo's
      # git source. GITHUB_TOKEN is scoped to this repository, so use the existing release PAT.
      - name: Authenticate the private Cargo git dependency
        env:
          GLEV_RELEASE_TOKEN: ${{ secrets.GLEV_RELEASE_TOKEN }}
        run: |
          test -n "$GLEV_RELEASE_TOKEN"
          git config --global url."https://x-access-token:${GLEV_RELEASE_TOKEN}@github.com/".insteadOf "https://github.com/"

      # rust-toolchain.toml is the only toolchain definition: it names the channel and the
      # components (rustfmt, clippy) that the steps below need.
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo fmt --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Every target compiles, tests included
        run: cargo check --workspace --tests

      # Boundary modules opt into `wildcard_enum_match_arm` /
      # `let_underscore_must_use` with module-level deny attributes. Running
      # clippy over their packages is what turns those attributes into a gate.
      - name: Fail-open lints
        run: scripts/check-fail-open-lints.sh

      # `[workspace.lints]` in Cargo.toml holds the deny-level lints behind the type, encapsulation
      # and scoped-release rules in AGENTS.md. Warnings are not promoted here: only the lints that
      # table denies gate the build.
      - name: Workspace lints
        run: cargo clippy --workspace --all-targets

      - name: Portable GQL crates stay free of workspace and Internet Computer dependencies
        run: scripts/check-dependency-direction.sh

      # `--workspace --tests` builds default features only, which is how `gleaph-gql --features format`
      # rotted after ADR 0089 added a grant resource variant the formatter did not handle
      # (GAP-2026-11-11-001). These crates keep non-default feature surfaces, so compile them too.
      - name: Portable GQL crates compile with their non-default feature surface
        run: |
          cargo check -p gleaph-gql --all-targets --features gleaph,format,cypher,sql-compat
          cargo check -p gleaph-gql-planner --all-targets
