name: Rust

# No Rust gate existed, which is how a stale `ProvisionGraphArgs` literal could stop the whole
# `gleaph-pocket-ic-tests` target set from compiling without anyone noticing (plans 0331/0343 added two
# fields and one struct literal did not follow). `--tests` is the point: `cargo check` alone skips test
# targets, and the breakage lived in one.
#
# The runner is macOS because the workspace includes macOS-only GUI crates; a Linux runner would fail on
# them for reasons unrelated to the change under review. Costs are bounded by the cache below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Every target compiles, tests included
        run: cargo check --workspace --tests

      # `--workspace --tests` builds default features only, which is how `gleaph-gql --features format`
      # rotted after ADR 0089 added a grant resource variant the formatter did not handle
      # (GAP-2026-11-11-001). These crates keep non-default feature surfaces, so compile them too.
      - name: Portable GQL crates compile with their non-default feature surface
        run: |
          cargo check -p gleaph-gql --all-targets --features gleaph,format,cypher,sql-compat
          cargo check -p gleaph-gql-planner --all-targets
