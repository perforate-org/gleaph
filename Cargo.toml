[workspace]
members = [
    "crates/auth",
    "crates/bulk-load-api",
    "crates/cli",
    "crates/codegen",
    "crates/gql",
    "crates/gql-integration",
    "crates/gql-ic",
    "crates/gql-ic-wire",
    "crates/gql-keywords",
    "crates/gql-macros",
    "crates/gql-params",
    "crates/gql-planner",
    "crates/gql-value",
    "crates/graph",
    "crates/graph-catalog",
    "crates/graph-index",
    "crates/graph-kernel",
    "crates/message-sizing",
    "crates/migration-api",
    "crates/prepared-runtime",
    "crates/vector-canister",
    "crates/ic-stable-lara",
    "crates/ic-stable-vector-page-store",
    "crates/ic-stable-paged-ordered-map",
    "crates/ic-stable-memory-backend",
    "crates/ic-stable-variable-memory-manager",
    "crates/ic-stable-vec-deque",
    "crates/ic-stable-clustered-hash-map",
    "crates/ic-stable-linear-hash-map",
    "crates/index-ddl",
    "crates/instruction-budget",
    "crates/account",
    "crates/pocket-ic-tests",
    "crates/prepared-api",
    "crates/provision",
    "crates/router",
    "examples/rust-canister-app",
    "sdk/canister/rust",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT or Apache-2.0"

[workspace.dependencies]
gleaph-account = { path = "crates/account" }
gleaph-auth = { path = "crates/auth" }
gleaph-bulk-load-api = { path = "crates/bulk-load-api" }
gleaph-cli = { path = "crates/cli" }
gleaph-cdk = { path = "sdk/canister/rust" }
gleaph-codegen = { path = "crates/codegen" }
gleaph-prepared-api = { path = "crates/prepared-api" }
gleaph-gql = { path = "crates/gql" }
gleaph-gql-integration = { path = "crates/gql-integration" }
gleaph-gql-keywords = { path = "crates/gql-keywords" }
gleaph-gql-ic = { path = "crates/gql-ic" }
gleaph-gql-ic-wire = { path = "crates/gql-ic-wire" }
gleaph-gql-params = { path = "crates/gql-params", default-features = false }
gleaph-gql-planner = { path = "crates/gql-planner" }
gleaph-gql-value = { path = "crates/gql-value", default-features = false }
gleaph-graph-catalog = { path = "crates/graph-catalog" }
gleaph-graph-index = { path = "crates/graph-index" }
gleaph-graph-kernel = { path = "crates/graph-kernel" }
gleaph-index-ddl = { path = "crates/index-ddl" }
gleaph-instruction-budget = { path = "crates/instruction-budget", default-features = false }
gleaph-message-sizing = { path = "crates/message-sizing" }
gleaph-migration-api = { path = "crates/migration-api" }
gleaph-prepared-runtime = { path = "crates/prepared-runtime" }
gleaph-vector-canister = { path = "crates/vector-canister" }
gleaph-router = { path = "crates/router" }
ic-stable-lara = { path = "crates/ic-stable-lara" }
ic-stable-vector-page-store = { path = "crates/ic-stable-vector-page-store" }
ic-stable-paged-ordered-map = { path = "crates/ic-stable-paged-ordered-map" }
ic-stable-memory-backend = { path = "crates/ic-stable-memory-backend" }
ic-stable-variable-memory-manager = { path = "crates/ic-stable-variable-memory-manager" }
ic-stable-vec-deque = { path = "crates/ic-stable-vec-deque" }
ic-stable-clustered-hash-map = { path = "crates/ic-stable-clustered-hash-map" }
ic-stable-linear-hash-map = { path = "crates/ic-stable-linear-hash-map" }

base64 = "0.23"
bitflags = "2.13.1"
canbench-rs = "0.7"
candid = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
concat-string = "1"
ethnum = "1.5.3"
f256 = "0.11"
flate2 = "1"
futures = "0.3"
half = "2"
ic-cdk = "0.20"
ic-cdk-macros = "0.20"
ic-cdk-management-canister = "0.1.1"
ic-cdk-timers = "1.0"
ic-agent = "0.49.2"
ic-management-canister-types = "0.7.1"
ic-stable-roaring = "0.1"
ic-stable-structures = "0.7.2"
jiff = "0.2.35"
libc = "0.2"
nohash-hasher = "0.2"
num-bigint = "0.5"
num-traits = "0.2"
pollster = "1.0"
rapidhash = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
rkyv = "0.8.18"
roaring = "0.11.4"
rust_decimal = "1.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
sha2 = "0.11"
tar = "0.4"
toml = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

# Dev/test compile-time tuning: keep line-level backtraces while reducing
# debug-info object size and linker work. Release/bench/canister profiles are
# intentionally unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
