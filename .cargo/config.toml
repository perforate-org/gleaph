# Canister artifacts are wasm32 (production target; matches the canbench benchmark builds and the
# PocketIC E2E suite). SIMD (simd128) is enabled for every wasm32 build. Scoping rustflags to the
# wasm32 target keeps host-side builds (cargo test/clippy) untouched and applies uniformly to
# pocket-ic E2E, dfx/icp, and manual builds.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

# Kept for a possible future re-switch to wasm64 (not the current production target). Stable
# memory survives width-change upgrades in both directions, so re-switching never strands data.
# wasm64 has no prebuilt std: such a build would additionally need nightly
# `-Z build-std=core,alloc,std,panic_abort` on top of these SIMD rustflags.
[target.wasm64-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

[unstable]
min-publish-age = true
embed-metadata = false

[registry]
global-min-publish-age = "14 days"
