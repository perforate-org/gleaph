/// Find films similar to a named anchor film by its Japanese title (`title_ja`): 似ている,
/// みたいな, に近い. Use this for Japanese film titles. The anchor is bound by the title_ja index;
/// the Router resolves its ELEMENT_ID, asks the Vector canister for the stored embedding, and
/// searches the same index generation. No client-side model or embedding asset is needed.
/// @param-resolver anchor film-title
MATCH (anchor:Film { title_ja: $anchor })
MATCH (f:Film)
SEARCH f IN (
  VECTOR INDEX film_embedding
  FOR anchor.embedding
  LIMIT 8
) SCORE AS similarity
RETURN f.title_ja AS title, f.year AS year, similarity
ORDER BY similarity DESC
