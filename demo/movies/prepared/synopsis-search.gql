/// Full-text keyword search over film synopses for $query. Use when the question asks which
/// films are about a topic, word, plot or phrase, for example "movies about insects",
/// "a movie about space", "films with sharks", "time travel movie", "a movie with a twist",
/// "movies with open endings or plot twists", "set in Europe", "set in Mexico", "set in Hawaii",
/// "a setting of Mexico", "psychological mystery", "special effects", "explosions", "dystopian
/// future", "female protagonist", "strong plot", "宇宙が出てくる映画", "学校が舞台の作品",
/// "AI が登場する話".
VALUE query STRING = $query
MATCH (f:Film)
RETURN f.title_ja AS title, f.year AS year, text_score(f.search_text, $query) AS score
ORDER BY text_score(f.search_text, $query) DESC
LIMIT 10
