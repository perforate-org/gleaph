CREATE GRAPH TYPE MovieGraph {
  NODE Film {
    title_ja STRING NOT NULL,
    title_en STRING,
    year INT32 NOT NULL,
    synopsis STRING NOT NULL,
    search_text STRING NOT NULL,
    qid STRING NOT NULL,
    embedding BYTES,
    staff_note STRING
  },
  NODE Person {
    name STRING NOT NULL,
    qid STRING NOT NULL
  },
  NODE Studio {
    name STRING NOT NULL,
    qid STRING NOT NULL
  },
  NODE Genre {
    name STRING NOT NULL
  },
  NODE Work {
    title_ja STRING NOT NULL,
    title_en STRING,
    kind STRING NOT NULL,
    qid STRING NOT NULL
  },
  NODE Magazine {
    name STRING NOT NULL,
    qid STRING NOT NULL
  },
  NODE Imprint {
    name STRING NOT NULL
  },
  DIRECTED EDGE Directed LABEL DIRECTED CONNECTING (Person -> Film),
  DIRECTED EDGE ActedIn LABEL ACTED_IN CONNECTING (Person -> Film),
  DIRECTED EDGE ProducedBy LABEL PRODUCED_BY CONNECTING (Film -> Studio),
  DIRECTED EDGE HasGenre LABEL HAS_GENRE CONNECTING (Film -> Genre),
  DIRECTED EDGE SequelOf LABEL SEQUEL_OF CONNECTING (Film -> Film),
  DIRECTED EDGE BasedOn LABEL BASED_ON CONNECTING (Film -> Work),
  DIRECTED EDGE SerializedIn LABEL SERIALIZED_IN CONNECTING (Work -> Magazine),
  DIRECTED EDGE PartOf LABEL PART_OF CONNECTING (Magazine -> Imprint)
}
