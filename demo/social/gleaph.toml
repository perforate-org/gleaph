# Gleaph CLI project configuration (ADR 0062).
#
# This pins the demo's CLI defaults so the user flow is just:
#
#   pnpm build:config          # regenerate seeds/ and src/data/*.generated.*
#   gleaph migration apply     # schema: graph type, typed graph, indexes
#   gleaph load seeds/vertices.jsonl seeds/edges.jsonl
#   gleaph prepared apply
#   gleaph codegen             # regenerate src/generated.ts from the Router manifest
#
# The Router canister principal is deployment-specific, so it is supplied per
# machine via GLEAPH_CANISTER (or --canister) instead of being committed here.

format_version = 1
default_network = "local"

[dirs]
migrations = "migrations"
prepared = "prepared"

[load]
graph = "social"
key = "social-demo-initial-load-v1"
state_file = ".load-state.json"

[codegen]
# `gleaph codegen` fetches the live prepared manifest from the Router
# (GLEAPH_CANISTER or --canister) and writes the typed client to `output`.
target = "typescript"
output = "src/generated.ts"
graph = "social"
