/// Semantic discovery: vector-only SEARCH over public posts.
/// @param offset Page offset (Int64, encoded by the Gateway).
/// @param query Query vector (Bytes, encoded by the Gateway).
MATCH (p:Post)<-[:POSTED]-(author:User) WHERE p.is_public = TRUE SEARCH p IN (VECTOR INDEX post_vec FOR $query LIMIT 10) DISTANCE AS distance RETURN p.demo_id AS post_id, author.name AS author_name, p.body AS body, distance ORDER BY distance ASC LIMIT 20 OFFSET $offset
