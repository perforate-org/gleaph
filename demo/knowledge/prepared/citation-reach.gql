/// Citation reach: Documents reachable from the GraphRAG paper through CITES up to depth 3,
/// returning the relationship trail as edge identities.
MATCH (src:Document {title: 'GraphRAG retrieval'})-[e:CITES]->{1,3}(dst:Document)
RETURN ELEMENT_ID(dst) AS document_id, dst.title AS title, ELEMENT_ID(e) AS cite_edge_id
