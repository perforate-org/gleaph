/// Fused full-text search over Document bodies and titles: the body scan's identity score is
/// summed with the title index's identity score per document, then ranked.
/// @text-fusion body,title
MATCH (d:Document)
RETURN ELEMENT_ID(d) AS document_id, d.title AS title, text_score(d.body, $query) AS score
ORDER BY text_score(d.body, $query) DESC LIMIT 5
