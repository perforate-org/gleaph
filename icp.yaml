# Gleaph platform canisters (Router, graph index, graph shard, vector).
#
# This project is the "manual deployment" prerequisite for the social demo:
# deploy these canisters (and register the demo graph) before running the
# demo's own flow under demo/social/. See demo/social/README.md.
#
# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.0.0/docs/schemas/icp-yaml-schema.json

# Canisters are built as **wasm64** (the IC runs 64-bit wasm). The `@dfinity/rust` recipe
# hardcodes `--target wasm32-unknown-unknown`, so the recipe's steps are replicated below as a
# script adapter with the wasm64 target plus `-Z build-std` (wasm64 has no prebuilt std) and SIMD
# from the workspace-root `.cargo/config.toml` target rustflags. Validation-only features
# (`batch-instr-log`) are intentionally **not** compiled into these production canister builds;
# the demo deploys its own explicitly-featured router build (see scripts/deploy-demo-local.sh).

canisters:
  - name: gleaph-router
    build:
      steps:
        - type: script
          commands:
            - command -v ic-wasm >/dev/null 2>&1 || { echo >&2 'ic-wasm not found. To install ic-wasm, see https://github.com/dfinity/ic-wasm \n'; exit 1; }
            - command -v candid-extractor >/dev/null 2>&1 || { echo >&2 'candid-extractor not found. Run `cargo install candid-extractor` to install it.'; exit 1; }
            - cargo build --package gleaph-router --target wasm64-unknown-unknown -Z build-std=core,alloc,std,panic_abort --release
            - TARGET_DIR=$(cargo metadata --format-version 1 --no-deps | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p'); cp "${TARGET_DIR}/wasm64-unknown-unknown/release/gleaph_router.wasm" "$ICP_WASM_OUTPUT_PATH"
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "${ICP_WASM_OUTPUT_PATH}" metadata "cargo:version" -d "$(cargo --version)" --keep-name-section
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "${ICP_WASM_OUTPUT_PATH}" metadata "template:type" -d "rust" --keep-name-section
            - did="$(mktemp)"; candid-extractor "$ICP_WASM_OUTPUT_PATH" >"$did" && ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "${ICP_WASM_OUTPUT_PATH}" metadata "candid:service" -f "$did" -v public --keep-name-section
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "${ICP_WASM_OUTPUT_PATH}" shrink --keep-name-section

  - name: gleaph-graph-index
