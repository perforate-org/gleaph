# Gleaph platform canisters (Router, graph index, graph shard, vector).
#
# This project is the "manual deployment" prerequisite for the social demo:
# deploy these canisters (and register the demo graph) before running the
# demo's own flow under demo/social/. See demo/social/README.md.
#
# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.0.0/docs/schemas/icp-yaml-schema.json

# Canisters are built as **wasm32** (the production target; matches canbench benchmark builds and
# the PocketIC E2E suite). The `@dfinity/rust` recipe hardcodes `--target wasm32-unknown-unknown`,
# so the recipe's build step is replicated below as a script adapter to keep the shared
# post-processing pipeline explicit, with SIMD from the workspace-root `.cargo/config.toml` target
# rustflags. Post-processing (metadata insertion, candid extraction, ic-wasm shrink with the name
# section kept) is owned by the shared `scripts/postprocess-canister-wasm.sh` entry point that
# every Gleaph canister build path uses.
# Validation-only features (`batch-instr-log`) are intentionally **not** compiled into these
# production canister builds; the demo deploys its own explicitly-featured router build
# (see scripts/deploy-demo-local.sh).

canisters:
  - name: gleaph-router
    build:
      steps:
        - type: script
          commands:
            - cargo build --package gleaph-router --target wasm32-unknown-unknown --release
            - TARGET_DIR=$(cargo metadata --format-version 1 --no-deps | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p'); cp "${TARGET_DIR}/wasm32-unknown-unknown/release/gleaph_router.wasm" "$ICP_WASM_OUTPUT_PATH"
            - '"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/scripts/postprocess-canister-wasm.sh" "$ICP_WASM_OUTPUT_PATH"'

  - name: gleaph-graph-index
    build:
      steps:
        - type: script
          commands:
            - cargo build --package gleaph-graph-index --target wasm32-unknown-unknown --release
            - TARGET_DIR=$(cargo metadata --format-version 1 --no-deps | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p'); cp "${TARGET_DIR}/wasm32-unknown-unknown/release/gleaph_graph_index.wasm" "$ICP_WASM_OUTPUT_PATH"
            - '"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/scripts/postprocess-canister-wasm.sh" "$ICP_WASM_OUTPUT_PATH"'

  - name: gleaph-graph-shard-0
    build:
      steps:
        - type: script
          commands:
            - cargo build --package gleaph-graph --target wasm32-unknown-unknown --release
            - TARGET_DIR=$(cargo metadata --format-version 1 --no-deps | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p'); cp "${TARGET_DIR}/wasm32-unknown-unknown/release/gleaph_graph.wasm" "$ICP_WASM_OUTPUT_PATH"
            - '"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/scripts/postprocess-canister-wasm.sh" "$ICP_WASM_OUTPUT_PATH"'

  - name: gleaph-vector
    build:
      steps:
        - type: script
          commands:
            - cargo build --package gleaph-vector-canister --target wasm32-unknown-unknown --release
            - TARGET_DIR=$(cargo metadata --format-version 1 --no-deps | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p'); cp "${TARGET_DIR}/wasm32-unknown-unknown/release/gleaph_vector_canister.wasm" "$ICP_WASM_OUTPUT_PATH"
            - '"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/scripts/postprocess-canister-wasm.sh" "$ICP_WASM_OUTPUT_PATH"'

networks:
  # Override the local network with a docker network
  - name: local
    mode: managed
    image: ghcr.io/dfinity/icp-cli-network-launcher
    port-mapping:
      - 0:4943
